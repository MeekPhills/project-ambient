name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS companion
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --package-path apps/macos
      - name: Test
        run: swift test --package-path apps/macos

  mcp:
    name: MCP service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:4d89c904835259bc58876520d20a64ea4877644f8988da8c978bccdde01e0701
        env:
          POSTGRES_DB: ambient_test
          POSTGRES_USER: ambient_test
          POSTGRES_PASSWORD: ambient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambient_test -d ambient_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/mcp
    env:
      TEST_POSTGRES_URL: postgresql://ambient_test:ambient_test@127.0.0.1:5432/ambient_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  site:
    name: Launch site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
